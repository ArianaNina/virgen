<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgen 3D</title>
<style>
body{margin:0;overflow:hidden;background:black;
}
canvas{display:block;
}
</style>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(45,window.innerWidth / window.innerHeight,0.1,1000);

camera.position.set(0, 3, 6);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
/* Luz ambiente */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
/* Luz principal */
const directionalLight = new THREE.DirectionalLight(0xffffff, 12);
directionalLight.position.set(9,18,9);
directionalLight.castShadow = true;
scene.add(directionalLight);
/* Luz celeste giratoria */
const pointLight = new THREE.PointLight(0x0000ff, 2000, 400);
pointLight.position.set(4, 4, 0);
pointLight.castShadow = true;
scene.add(pointLight);
const blueSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 32, 32),
    new THREE.MeshBasicMaterial({
        color: 0x0000ff
    })
);
scene.add(blueSphere);
/* Luz azul */
const spotLight = new THREE.SpotLight(0xffffff, 600);
/*spotLight.position.set(4, 9, 2);*/
spotLight.angle = Math.PI / 4;
spotLight.penumbra= 1;
scene.add(spotLight);
/* Luz blanca frontal */
const frontLight = new THREE.PointLight(0xCCCCCC, 200, 200);
frontLight.position.set(0, 8, 1);
scene.add(frontLight);
/* Piso */
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.MeshStandardMaterial({
        color:0x444444
    })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
/*Estatua virgen del socabon*/
const loader = new GLTFLoader();
loader.load('./virgen_mitad.glb',
 function(gltf){const model = gltf.scene;
        model.scale.set(1.5, 1.5, 1.5);
        model.position.set(0,0.75, 0);
        model.traverse((obj)=>{
            if(obj.isMesh){
                obj.castShadow = true;
                obj.receiveShadow = true;
            }
        });
        scene.add(model);
    },
    undefined,
    function(error){
        console.error("Error cargando GLB:", error);
    }
);
function animate(){
   requestAnimationFrame(animate);
    const t = Date.now() * 0.001;
    pointLight.position.x = Math.sin(t) * 6;
    pointLight.position.z = Math.cos(t) * 6;
    pointLight.position.y = 4;

    blueSphere.position.copy(pointLight.position);
    controls.update();
    renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    
    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>
</body>
</html>
